[package]
name = "overmatch"
version = "0.6.0"
edition = "2024"
default-run = "overmatch"
publish = false

[dependencies]
# `basis-universal`: the terrain surface maps ship as KTX2 holding UASTC 4x4 blocks
# (`scripts/encode-terrain-ktx2.sh`). `ktx2` + `zstd_rust` are already on through bevy's defaults
# and handle the container and its supercompression, but the UASTC payload itself is transcoded at
# load — to ASTC 4x4 on Apple Silicon, BC7 on other desktop GPUs — and THAT transcoder lives
# behind this feature. Without it the load fails, which (by `world::report_failed_terrain_map`) is
# now a panic rather than an invisible ground.
# `jpeg`: not the terrain any more — kept because bevy's default formats stop at PNG/HDR/KTX2 and
# dropping it would silently break any JPG that shows up in a glTF or a future asset.
bevy = { version = "0.19", features = ["debug", "jpeg", "basis-universal"] }
avian3d = { version = "0.7", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
# Lightyear 0.30's message serializer (`lightyear_serde`'s default), named directly only by
# `net::shot_transport`'s batch wire-size bound, which must measure a batch in the exact encoding the
# wire carries. Already in the tree through lightyear (same locked version).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
ron = "0.12"
# Already in the tree through bevy_math (same locked version — this adds no compiled crate); named
# directly only by `ballistics::spall_cone`, whose direction generator must give the same bits on
# every shipped target, which the platform's own `sin`/`cos` do not (CI measured Linux differing).
libm = "0.2.16"
glam ={ version = "0.32.1", features = ["serde", "scalar-math"] }
winit = "0.30"
# Already in the tree through bevy (same locked version); named directly only by the present-mode
# capability probe (`settings::probe`), which needs `SurfaceTargetUnsafe` and the wgpu-side
# `PresentMode` — neither of which bevy re-exports. No features: bevy enables what the backend needs.
wgpu = { version = "29.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = { version = "1", optional = true }
bevy_egui = { version = "0.42", optional = true }
# Named by no code: it fixes bevy_winit's feature set across builds. bevy_egui asks for its default
# features, bevy does not, so without this line a `dev_ui` build hashes bevy_winit differently and
# compiles a second copy of it and of everything above it (avian3d, lightyear, bevy's plugin
# crates). Its one default, `x11`, is already on through bevy; only the feature name differs.
bevy_winit = "0.19"
gltf = "1.4"
# Already in the tree through the asset stack (same locked version — this adds no compiled crate);
# named directly only by `geometry_lod::certificate`, which fingerprints the shipped trio's bytes
# against the `view_glb_sha` / `sim_glb_sha` the tank build recorded (ADR-0035).
sha2 = "0.10"
lightyear = { version = "0.30.1", default-features = false, features = [
    "std",
    "client", "server",
    "replication", "interpolation",
    "input_native",
    "netcode", "udp",
    "avian3d",
] }
lightyear_transport = "0.30.1"
bevy_replicon = "0.44"
# The pen cam's CAD glass look (dev variant L4, `damage_cam::pen_cam::look`): a constant-pixel
# jump-flood outline around the struck components. MIT OR Apache-2.0; its bevy features are a
# subset of the defaults this crate already builds.
# Blocking HTTPS to the matchmaking Worker, never on the frame loop: the hosted server's reports
# (`net::hosting`, a background thread) and the client's join calls (`net::matchmaking::worker`,
# short-lived threads). `rustls` = rustls on ring with the bundled webpki roots, so neither the
# server image nor the client needs a system CA store or OpenSSL; `gzip` (a default) is off.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

# The Objective-C runtime's own C declarations. Already in the tree through winit's `objc2` (same
# locked version — this adds no compiled crate); named directly only by `quit::terminate`, which
# installs one `applicationShouldTerminate:` method on winit's delegate class.
#
# WHY THE CRATE RATHER THAN A HAND-WRITTEN `extern "C"` BLOCK: the two types in that call are the
# two that are easiest to get silently wrong, and a foreign declaration whose ABI does not match the
# library is unsound whatever it happens to do today. `BOOL` is C `_Bool` on aarch64-apple and
# `signed char` on x86_64-apple (`objc-sys`' `types.rs` carries the cfg matrix), and `IMP` is a
# NULLABLE FUNCTION pointer — `Option<unsafe extern "C" fn()>` — not a `*const c_void`. We ship
# macOS on arm64 only, but correctness here does not get to depend on that.
[target.'cfg(target_os = "macos")'.dependencies]
objc-sys = "0.3"
# AppKit bindings for the hidden-capture activation revocation in `net::client` (winit hardcodes
# activate-at-launch; see `revoke_macos_activation`) and for the display row's real monitor names
# (winit's own `MonitorHandle::name` is a model number on macOS; see `settings::displays`).
# Version-matched to winit 0.30's OWN objc2-app-kit dependency (Cargo.lock pins both at 0.2.2), so
# this adds no second copy of the crate to the graph — arboard's 0.3.x line is a separate,
# pre-existing major. Features are the minimum for those two call sites: `NSResponder` gates the
# `NSApplication` class itself, `NSApplication` its methods, `NSRunningApplication` the
# activation-policy API; `NSScreen` gates the screen list and `localizedName`, and `NSGraphics` the
# `deviceDescription` the display ID is read from. In this 0.2.x generation `MainThreadMarker` lives
# in objc2-foundation, with `NSThread` gating its CHECKED constructor (without it only the unsafe
# `new_unchecked` exists) and `NSValue` the `NSNumber` that device description holds.
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
] }
objc2-foundation = { version = "0.2.2", features = ["NSThread", "NSValue"] }

# Without their defaults, so a test build and a bin build give these crates one feature set and
# share their compiled copies: lightyear depends on each with `default-features = false`, and its
# `std` already turns on the `std` their defaults name.
[dev-dependencies]
lightyear_sync = { version = "0.30.1", default-features = false }
lightyear_core = { version = "0.30.1", default-features = false }
lightyear_inputs = { version = "0.30.1", default-features = false }
lightyear_inputs_native = { version = "0.30.1", default-features = false }

[features]
default = ["dev_tools"]
dev_tools = []
bitprobe = ["dep:flate2"]
dev_ui = ["dep:bevy_egui"]

# The one home for lint policy. Levels are `warn`: CI's `clippy -- -D warnings` promotes them to
# errors, local iteration is never blocked. Applies to this package only, never to `vendor/`.
[lints.clippy]
# Bevy query and `SystemParam` tuples are the engine's language, not a smell.
type_complexity = "allow"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
needless_collect = "warn"
# A function body stays within `clippy.toml`'s threshold, red in CI; function, not file (quality standard §B1).
too_many_lines = "warn"

[patch.crates-io]
bevy_reflect = { path = "vendor/bevy_reflect-0.19.1-scalar-math" }
bevy_pbr = { path = "vendor/bevy_pbr-0.19.1-scalar-math" }

# `cargo test` builds one test artifact, the lib's: every test is a `#[cfg(test)]` module of the
# lib, so the bins below hold none (`test = false`) and the docs carry no doctest.
[lib]
doctest = false

[[bin]]
name = "overmatch"
path = "src/main.rs"
test = false

[[bin]]
name = "overmatch-server"
path = "src/bin/overmatch-server.rs"
test = false

[[bin]]
name = "asset_verify"
path = "src/bin/asset_verify.rs"
test = false

[[bin]]
name = "bitprobe"
path = "src/bin/bitprobe.rs"
test = false
required-features = ["bitprobe"]

[[bin]]
name = "ballistic_fuzzer"
path = "src/bin/ballistic_fuzzer.rs"
test = false
required-features = ["dev_tools"]

[[bin]]
name = "track_sandbox"
path = "src/bin/track_sandbox.rs"
test = false
required-features = ["dev_ui"]

[[bin]]
name = "armor_sandbox"
path = "src/bin/armor_sandbox.rs"
test = false
required-features = ["dev_ui"]

[[bin]]
name = "pen_cam_demo"
path = "src/bin/pen_cam_demo.rs"
test = false
required-features = ["dev_tools"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Unpacked debuginfo on macOS keeps every codegen unit's object file in `target/*/deps`, and
# rustc never removes superseded ones (rust-lang/rust#161824), so each rebuild leaks a full set.
# Off keeps no objects; the cost is file:line in test-harness backtraces.
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.dev-full]
inherits = "dev"
debug = 2
# A debugger needs the object files that `dev` stops keeping.
split-debuginfo = "unpacked"

# The edit loop's test profile: `scripts/serial-cargo test` builds under it unless the caller names a
# profile. Dev's default thin-local LTO pass is 33–39 s of a ~50 s crate rebuild whatever the edit;
# without it a one-line edit rebuilds in ~18 s and tests run ~20 % slower (MEASURED,
# `.agents/scratch/build-throughput-2026-10-24/measurements.md`). Dev keeps the pass because its
# dependencies would lose it too, at a play-build frame cost not measured; `lto` cannot be set per
# package.
[profile.edit]
inherits = "dev"
lto = "off"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The symbolicated release variant for profilers (`cargo build --profile profiling`, or
# `--profile profiling` on any run/test invocation). Release's `strip = true` blinds every
# SAMPLING profiler — Instruments and samply resolve stacks from the binary's symbols, so a
# stripped build profiles as one anonymous blob — and sim numbers are only honest at release
# optimization (the dev profile builds THIS crate at opt-level 1). Same codegen as release;
# only symbols + debug info differ, so the numbers transfer.
[profile.profiling]
inherits = "release"
strip = false
debug = true

# Release optimization without release's slow build, for the on-demand measurements that need
# optimized code (`cargo test --profile perf …`): no LTO, 16 codegen units, incremental. Release
# took 601 s cold and 343 s after a one-line edit (MEASURED 2026-10-24, one agent's worktree). A
# timing taken under it compares with other `perf` timings, not with a shipped (release) number.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
