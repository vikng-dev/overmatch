[package]
name = "overmatch"
version = "0.3.1"
edition = "2024"
default-run = "overmatch"

[dependencies]
# `basis-universal`: the terrain surface maps ship as KTX2 holding UASTC 4x4 blocks
# (`scripts/encode-terrain-ktx2.sh`). `ktx2` + `zstd_rust` are already on through bevy's defaults
# and handle the container and its supercompression, but the UASTC payload itself is transcoded at
# load — to ASTC 4x4 on Apple Silicon, BC7 on other desktop GPUs — and THAT transcoder lives
# behind this feature. Without it the load fails, which (by `world::report_failed_terrain_map`) is
# now a panic rather than an invisible ground.
# `jpeg`: not the terrain any more — kept because bevy's default formats stop at PNG/HDR/KTX2 and
# dropping it would silently break any JPG that shows up in a glTF or a future asset.
bevy = { version = "0.19", features = ["debug", "jpeg", "basis-universal"] }
avian3d = { version = "0.7", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
bincode = { version = "2.0.1", features = ["serde"] }
ron = "0.12"
glam = { version = "0.32.1", features = ["serde", "scalar-math"] }
winit = "0.30"
# Already in the tree through bevy (same locked version); named directly only by the present-mode
# capability probe (`settings::probe`), which needs `SurfaceTargetUnsafe` and the wgpu-side
# `PresentMode` — neither of which bevy re-exports. No features: bevy enables what the backend needs.
wgpu = { version = "29.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = { version = "1", optional = true }
bevy_egui = { version = "0.41", optional = true }
gltf = "1.4"
# Already in the tree through the asset stack (same locked version — this adds no compiled crate);
# named directly only by `geometry_lod::certificate`, which fingerprints the shipped trio's bytes
# against the `view_glb_sha` / `sim_glb_sha` the tank build recorded (ADR-0035).
sha2 = "0.10"
lightyear = { version = "0.28", default-features = false, features = [
    "std",
    "client", "server",
    "replication", "prediction", "interpolation",
    "frame_interpolation",
    "input_native",
    "netcode", "udp",
    "avian3d",
] }
lightyear_transport = "0.28"
bevy_replicon = "0.41"

# The Objective-C runtime's own C declarations. Already in the tree through winit's `objc2` (same
# locked version — this adds no compiled crate); named directly only by `quit::terminate`, which
# installs one `applicationShouldTerminate:` method on winit's delegate class.
#
# WHY THE CRATE RATHER THAN A HAND-WRITTEN `extern "C"` BLOCK: the two types in that call are the
# two that are easiest to get silently wrong, and a foreign declaration whose ABI does not match the
# library is unsound whatever it happens to do today. `BOOL` is C `_Bool` on aarch64-apple and
# `signed char` on x86_64-apple (`objc-sys`' `types.rs` carries the cfg matrix), and `IMP` is a
# NULLABLE FUNCTION pointer — `Option<unsafe extern "C" fn()>` — not a `*const c_void`. We ship
# macOS on arm64 only, but correctness here does not get to depend on that.
[target.'cfg(target_os = "macos")'.dependencies]
objc-sys = "0.3"
# AppKit bindings for the hidden-capture activation revocation in `net::client` (winit hardcodes
# activate-at-launch; see `revoke_macos_activation`). Version-matched to winit 0.30's OWN
# objc2-app-kit dependency (Cargo.lock pins both at 0.2.2), so this adds no second copy of the
# crate to the graph — arboard's 0.3.x line is a separate, pre-existing major. Features are the
# minimum for that one call site: `NSResponder` gates the `NSApplication` class itself,
# `NSApplication` its methods, `NSRunningApplication` the activation-policy API. In this 0.2.x
# generation `MainThreadMarker` lives in objc2-foundation, with `NSThread` gating its CHECKED
# constructor (without it only the unsafe `new_unchecked` exists).
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }

[dev-dependencies]
lightyear_sync = "0.28"
lightyear_core = "0.28"
lightyear_inputs = "0.28"
lightyear_inputs_native = "0.28"

[features]
default = ["dev_tools"]
dev_tools = []
bitprobe = ["dep:flate2"]
dev_ui = ["dep:bevy_egui"]

[patch.crates-io]
bevy_reflect = { path = "vendor/bevy_reflect-0.19.0-scalar-math" }
bevy_pbr = { path = "vendor/bevy_pbr-0.19.0-scalar-math" }
bevy_light = { path = "vendor/bevy_light-0.19.0-cascade-count" }

[[bin]]
name = "overmatch"
path = "src/main.rs"

[[bin]]
name = "overmatch-server"
path = "src/bin/overmatch-server.rs"

[[bin]]
name = "asset_verify"
path = "src/bin/asset_verify.rs"

[[bin]]
name = "bitprobe"
path = "src/bin/bitprobe.rs"
required-features = ["bitprobe"]

[[bin]]
name = "ballistic_fuzzer"
path = "src/bin/ballistic_fuzzer.rs"
required-features = ["dev_tools"]

[[bin]]
name = "track_sandbox"
path = "src/bin/track_sandbox.rs"
required-features = ["dev_ui"]

[[bin]]
name = "armor_sandbox"
path = "src/bin/armor_sandbox.rs"
required-features = ["dev_ui"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.dev-full]
inherits = "dev"
debug = 2

[profile.ci]
inherits = "dev"
opt-level = 0

[profile.ci.package."*"]
opt-level = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The symbolicated release variant for profilers (`cargo build --profile profiling`, or
# `--profile profiling` on any run/test invocation). Release's `strip = true` blinds every
# SAMPLING profiler — Instruments and samply resolve stacks from the binary's symbols, so a
# stripped build profiles as one anonymous blob — and sim numbers are only honest at release
# optimization (the dev profile builds THIS crate at opt-level 1). Same codegen as release;
# only symbols + debug info differ, so the numbers transfer.
[profile.profiling]
inherits = "release"
strip = false
debug = true
