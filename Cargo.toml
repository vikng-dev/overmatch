[package]
name = "overmatch"
version = "0.3.0-alpha.10"
edition = "2024"
default-run = "overmatch"

[dependencies]
# `jpeg`: the terrain ground diffuse ships as a 4k JPG (`assets/terrain/coast_sand_rocks_02_diff_4k.jpg`);
# bevy's default image formats stop at PNG/HDR/KTX2, and a failed texture load leaves the terrain
# material unprepared — the whole render mesh silently never draws.
bevy = { version = "0.19", features = ["debug", "jpeg"] }
avian3d = { version = "0.7", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
bincode = { version = "2.0.1", features = ["serde"] }
ron = "0.12"
glam = { version = "0.32.1", features = ["serde", "scalar-math"] }
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = { version = "1", optional = true }
bevy_egui = { version = "0.41", optional = true }
gltf = "1.4"
lightyear = { version = "0.28", default-features = false, features = [
    "std",
    "client", "server",
    "replication", "prediction", "interpolation",
    "frame_interpolation",
    "input_native",
    "netcode", "udp",
    "avian3d",
] }
lightyear_transport = "0.28"
bevy_replicon = "0.41"

[dev-dependencies]
lightyear_sync = "0.28"
lightyear_core = "0.28"
lightyear_inputs = "0.28"
lightyear_inputs_native = "0.28"

[features]
default = ["dev_tools"]
dev_tools = []
bitprobe = ["dep:flate2"]
dev_ui = ["dep:bevy_egui"]

[patch.crates-io]
bevy_reflect = { path = "vendor/bevy_reflect-0.19.0-scalar-math" }
bevy_pbr = { path = "vendor/bevy_pbr-0.19.0-scalar-math" }

[[bin]]
name = "overmatch"
path = "src/main.rs"

[[bin]]
name = "overmatch-server"
path = "src/bin/overmatch-server.rs"

[[bin]]
name = "bitprobe"
path = "src/bin/bitprobe.rs"
required-features = ["bitprobe"]

[[bin]]
name = "track_sandbox"
path = "src/bin/track_sandbox.rs"
required-features = ["dev_ui"]

[[bin]]
name = "armor_sandbox"
path = "src/bin/armor_sandbox.rs"
required-features = ["dev_ui"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.dev-full]
inherits = "dev"
debug = 2

[profile.ci]
inherits = "dev"
opt-level = 0

[profile.ci.package."*"]
opt-level = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
