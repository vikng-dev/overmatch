name: Build overmatch-server
description: >-
  The single canonical build + package recipe for the Linux `overmatch-server`
  dedicated server. Runs as steps inside the caller's job: toolchain -> resolve
  the asset allowlist -> LFS pull over that allowlist -> apt deps -> rust-cache
  -> cargo build -> tar over the same allowlist. release.yml's `build-server` is
  the only caller; its one tarball is both deployed and released.

# CONTRACT (the seam):
#   * The CALLER checks out the repo FIRST, with `lfs: false` and
#     `persist-credentials: false`. Checkout stays job-level so the local composite
#     resolves. The caller does NOT pull LFS: the server ships a small slice of
#     `assets/`, and hydrating it is packaging's business, so it happens here where
#     the allowlist that decides the slice is written down. (The client jobs still
#     `git lfs pull` whole — they ship whole.)
#   * THIS action then does everything build-shaped and leaves
#     `overmatch-server.tar.gz` in the workspace root (exposed as the `tar`
#     output). What the caller does with that tar (upload-artifact / attach to
#     release / scp to droplet) is the caller's business.

inputs:
  deployed-sha:
    description: >-
      When 'true', embed a DEPLOYED_SHA marker (GITHUB_SHA) inside the tar so the
      droplet + run log can state exactly which commit is live. The marker is a
      packaging detail that goes INSIDE the tar, so it belongs with the packaging
      step here rather than as a caller-side re-tar — one canonical tar.
    required: false
    default: 'false'

outputs:
  tar:
    description: Path (workspace-relative) to the produced server tarball.
    value: overmatch-server.tar.gz

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable

    # THE ASSET SET IS AN ALLOWLIST, stated POSITIVELY: these are the paths `overmatch-server`
    # OPENS, not `assets/` minus whatever seemed heavy. The server mounts `SimPlugin` and no client
    # plugin, so it is a short list — and it is not derivable from the client's, which is why it is
    # written down here with what opens each one:
    #
    #   maps/*/level.json, maps/*/*.png  crate::map::parse and terrain_grid's height decode
    #                                    (src/world.rs, src/terrain_grid.rs), plus the handshake
    #                                    content digest. EVERY map, not the default one: the map is
    #                                    an $OVERMATCH_MAP runtime choice and the heightmap's file
    #                                    name is read OUT of level.json, so neither can be resolved
    #                                    at packaging time. `derived/` is excluded — `map_ui.png` is
    #                                    loaded only by `net::spawn_map`, a client plugin.
    #   shell/shell.glb                  ballistics::setup_assets, a Startup system inside
    #                                    SimPlugin with no window gate (src/ballistics.rs)
    #   <id>/<id>.sim.glb                the bake's consumer contract, the geometry_lod trio
    #                                    fingerprint, and the track rig's marker read — the ONE
    #                                    geometry artifact the server opens (ADR 0035)
    #   <id>/<id>.lod.json               geometry_lod::load_certificate, which panics without it
    #   <id>/<id>.tank.ron               the spec sheet, loaded through the AssetServer
    #
    # WHAT IS DELIBERATELY ABSENT, each proven client-only by the plugin that loads it: `<id>.glb`,
    # the 64 MB view artifact (geometry_lod::view_plugin, mounted only by the client roots); the
    # terrain KTX2 (behind `!windows.is_empty()`, and the server builds no primary window); the vfx
    # atlases, the shaders and the fonts (vfx/render_scale/ui_font plugins, client roots only); and
    # `materials/materials.ron`, which is `include_str!`d into the binary rather than read.
    #
    # The vehicles are DISCOVERED by the same trio rule the door and the hook use, so a second
    # vehicle ships without a line here. A named path that is missing is a FAILURE, not a smaller
    # tarball: the server would boot and panic on the droplet — so the check is here, before the
    # twenty-minute build, rather than at `cp` time.
    #
    # ONE LIST, TWO CONSUMERS: the file written here is what the LFS pull hydrates AND what the tar
    # packs. The `--include` list cannot drift from the tarball's contents because it IS the
    # tarball's contents; the pointer check after the pull is the tripwire that says so.
    - name: Resolve the server asset allowlist
      id: allowlist
      shell: bash
      run: |
        set -euo pipefail
        stems=()
        while IFS= read -r stem; do stems+=("$stem"); done < <(
          git ls-files |
          awk '
            /\.blend$/     { blend[substr($0, 1, length($0) - 6)] = 1; next }
            /\.tank\.ron$/ { sheet[substr($0, 1, length($0) - 9)] = 1; next }
            /\.glb$/       { model[substr($0, 1, length($0) - 4)] = 1 }
            END { for (stem in blend) if (stem in sheet && stem in model) print stem }
          ' | LC_ALL=C sort
        )
        if [[ ${#stems[@]} -eq 0 ]]; then
          echo "::error::No asset trio found — the server tarball would carry no vehicle"
          exit 1
        fi
        paths=("assets/shell/shell.glb")
        for stem in "${stems[@]}"; do
          paths+=("${stem}.sim.glb" "${stem}.lod.json" "${stem}.tank.ron")
        done
        while IFS= read -r path; do paths+=("$path"); done < <(
          find assets/maps -type f \( -name '*.json' -o -name '*.png' \) \
            -not -path 'assets/maps/*/derived/*' | LC_ALL=C sort
        )
        for path in "${paths[@]}"; do
          if [[ ! -f "${path}" ]]; then
            echo "::error::${path} is on the server's allowlist and is not in this checkout"
            exit 1
          fi
        done
        printf 'server asset: %s\n' "${paths[@]}"
        printf '%s\n' "${paths[@]}" > "${RUNNER_TEMP}/server-assets.txt"
        echo "file=${RUNNER_TEMP}/server-assets.txt" >> "${GITHUB_OUTPUT}"

    # LFS on R2 via the committed `.lfsconfig` (checkout `lfs: true` ignores it and hits GitHub, so
    # the caller checks out with `lfs: false` and the pull happens here). Scoped to the allowlist:
    # the full repo is ~210 MB of LFS objects — the Tiger's `.blend` and view `.glb` alone are 131 MB
    # — against ~14 MB the server actually ships, and downloading the rest to delete it is the whole
    # cost being cut. Paths on the allowlist that are not LFS-tracked (level.json, `.lod.json`,
    # `.tank.ron`) are simply not matched by any pointer and cost nothing to name.
    #
    # Then the tripwire: a `--include` that fails to match leaves a ~130-byte pointer file in place,
    # which `cp` would cheerfully pack and the droplet would panic on. Refuse instead.
    - name: Git LFS pull (R2, the allowlist only)
      shell: bash
      env:
        ASSETS: ${{ steps.allowlist.outputs.file }}
      run: |
        set -euo pipefail
        git lfs install --local
        git lfs pull --include="$(paste -sd, "${ASSETS}")"
        while IFS= read -r path; do
          if head -c 42 "${path}" | LC_ALL=C grep -qa '^version https://git-lfs'; then
            echo "::error::${path} is still an LFS pointer after the scoped pull — the --include list no longer covers the allowlist"
            exit 1
          fi
        done < "${ASSETS}"

    # Bevy needs alsa/udev + windowing libs to COMPILE on Linux even though the server runs headless.
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libasound2-dev libudev-dev \
          libwayland-dev libxkbcommon-dev libx11-dev

    # Shared server build cache (key: server-net) — release, dispatch, and deploy all warm the
    # same cache on purpose.
    - uses: Swatinem/rust-cache@v2
      with:
        key: server-net

    # --locked builds against the committed Cargo.lock (reproducible). release profile = strip +
    # thin LTO.
    - name: Build server
      shell: bash
      run: cargo build --release --locked --bin overmatch-server

    # Stage a self-contained folder: the binary alongside the assets it opens, so on the droplet
    # `BEVY_ASSET_ROOT=<extracted dir>` finds them and `./overmatch-server` just runs. The assets
    # are the allowlist resolved above — the same list the LFS pull hydrated, read back rather than
    # recomputed. With deployed-sha=true, also drop a DEPLOYED_SHA marker inside the folder before
    # packing.
    - name: Package
      shell: bash
      env:
        ASSETS: ${{ steps.allowlist.outputs.file }}
        DEPLOYED_SHA: ${{ inputs.deployed-sha }}
      run: |
        set -euo pipefail
        mkdir -p stage/overmatch-server
        cp target/release/overmatch-server stage/overmatch-server/
        while IFS= read -r path; do
          mkdir -p "stage/overmatch-server/$(dirname "${path}")"
          cp "${path}" "stage/overmatch-server/${path}"
        done < "${ASSETS}"
        if [ "${DEPLOYED_SHA}" = "true" ]; then
          printf '%s\n' "${GITHUB_SHA}" > stage/overmatch-server/DEPLOYED_SHA
        fi
        tar -C stage -czf overmatch-server.tar.gz overmatch-server
        du -sh stage/overmatch-server
        ls -lh overmatch-server.tar.gz
