name: Release

# The single build + deploy + publish pipeline for the PRODUCT (`overmatch`, the PVP client) and
# the `overmatch-server` (dedicated server).
#
# WHAT IS GUARANTEED: no Release becomes visible unless the droplet is already running this run's
# server artifact AND both packaged clients have been unpacked and driven through a real connect.
# The Release stays a DRAFT until every one of those has passed.
#
# WHAT IS NOT: the reverse. `deploy-server` precedes `publish-release` and nothing rolls it back,
# so a run whose deploy succeeded and whose smoke then failed leaves the DROPLET on the new build
# with the new Release unpublished — the visible Release is then older than the droplet, and a
# client downloaded from it is refused at the handshake until the next tag lands. ACCEPTED, not
# overlooked: the fix would be rollback machinery on a droplet that ephemeral per-version servers
# are about to replace, and at zero players the cost of that window is a message in chat.
#
# A `vX.Y.Z` TAG runs the whole pipeline from the tag SHA:
#
#     create-release (draft) ─┬─ build-client (windows, linux) ─┬─ smoke (win, linux) ─┐
#                             └─ build-server (linux) ──────────┘                      │
#                             upload-client / upload-server / deploy-server ───────────┴─ publish
#
#   * Windows `overmatch`        — the PVP client (zip), server address baked to the droplet.
#   * Linux   `overmatch`        — the PVP client (tar.gz), server address baked to the droplet.
#   * Linux   `overmatch-server` — the dedicated server, tar with its asset allowlist.
#
#   THE SMOKE GATES THE PUBLISH. Each lane extracts the archives a user downloads, with no path
#   surgery, and drives the packaged client through a full connect against the packaged server
#   (`scripts/ci/archive-smoke.sh`). This is the one catastrophe this pipeline exists to prevent: a
#   published release whose client cannot boot or connect — which shipped three times in August
#   2026, when the runner's checkout rewrote `assets/maps/*/level.json` to CRLF and the map digest
#   inside the handshake's `protocol_id` (ADR-0018) stopped matching the server's.
#
#   Cut a release by bumping `version` through a PR, then tagging the merged main SHA (the tag must
#   be an ancestor of `origin/main`). Any failure upstream leaves the draft unpublished, so no
#   broken Release becomes visible.
#
# macOS IS ON DEMAND, not on the tag path. It is a ~1h20m job on the only platform nobody
# currently playtests on, and holding every tag behind it bought nothing. So a dispatch does one of
# two disjoint things, decided by the `tag` input:
#
#   * `tag` SET — the attach path: build the arm64 client from THAT TAG, sign + notarize it, and
#     attach the .dmg to that tag's existing Release. Nothing else runs. The Windows/Linux/server
#     builds and the smoke are gated OFF here on purpose: they would run from the dispatched ref,
#     which is not the commit being attached to, and their verdict about it means nothing.
#   * `tag` EMPTY — build-only smoke mode: server + both clients + the archive smoke off the
#     dispatched ref, plus the unsigned .app as an artifact. Neither the droplet nor any Release is
#     touched, and no Apple secret is materialized.
#
# The server tarball is kept as a plain artifact on both build paths for `scp` redeploys to the
# test droplet (see DEPLOY.md).
#
# Phase 1 (now): GitHub Releases. Phase 2 (later): the same output feeds Steam via SteamPipe.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # stable, e.g. v0.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # prerelease, e.g. v0.3.0-alpha.1
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing vX.Y.Z tag to build the macOS .dmg from and attach to its Release. Leave empty
          for a build-only smoke run off the dispatched ref (nothing is signed, nothing published).
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The DigitalOcean test droplet (DEPLOY.md). Baked into the release client at compile time via
  # `option_env!("OVERMATCH_DEFAULT_SERVER")` (net::client::run), so a friend's double-clicked build
  # connects to the droplet with no env set. Overridable at runtime with `OVERMATCH_SERVER`. Every
  # step's cargo build inherits this workflow-level env, so the client jobs need no extra wiring.
  OVERMATCH_DEFAULT_SERVER: droplet.overmatch.win:5888

jobs:
  # The DRAFT GitHub Release shell — tag pushes only. A manual dispatch never publishes, even when
  # it is launched from a tag ref. The client/macOS jobs `needs` this, so on a dispatch they skip
  # with it; the server job runs regardless (see its `if`). Every upload job below attaches to this
  # draft; `publish-release` un-drafts it once the droplet runs this build.
  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Full history: the ancestry check below asks whether the tag's commit is reachable from
      # main, and a depth-1 checkout holds neither side's history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # CARGO_PKG_VERSION participates in the network protocol fingerprint. Reject label/handshake
      # skew and a stale lockfile before creating an empty or misleading GitHub Release shell.
      - name: Verify release versions and tag agree
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          lock_version="$(awk -F '"' '$0 == "name = \"overmatch\"" { found = 1; next } found && /^version =/ { print $2; exit }' Cargo.lock)"
          expected_tag="v${cargo_version}"
          if [[ -z "${cargo_version}" || "${lock_version}" != "${cargo_version}" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Release identity mismatch: tag=${GITHUB_REF_NAME} Cargo.toml=${cargo_version:-<missing>} Cargo.lock=${lock_version:-<missing>}"
            exit 1
          fi
      # Every asset ships inside every client archive, and every build job DELETES the `.blend`
      # before packaging — after which nothing downstream can re-derive the model or say what it
      # was cut from. What this job must establish is IDENTITY, not semantics: the trio
      # certificate beside each model (`<id>.lod.json`, ADR-0035) records the sha256 of both
      # tracked artifacts as the door certified them, and the door itself — consumer contract,
      # KTX2 derivation, full re-cut under the pinned Blender — runs post-hoc in CI whenever a
      # trio changes. Bytes that match the certificate are bytes the door passed; re-proving
      # semantics here linked the whole crate, ~20 min cold on EVERY tag, because a release bumps
      # the lockfile and the lockfile was the cache key.
      #
      # The assets are DISCOVERED, by the same trio rule the door and the hook use — `<id>.blend`,
      # `<id>.tank.ron`, `<id>.glb` in one directory — so a second vehicle is gated by the rule
      # that found the first. Only the models are hydrated: a `.blend` in the checkout is a
      # pointer file, which is all discovery reads.
      - name: Every shipped model is the byte-exact artifact its certificate names
        shell: bash
        run: |
          set -euo pipefail
          stems=()
          while IFS= read -r stem; do stems+=("$stem"); done < <(
            git ls-files |
            awk '
              /\.blend$/     { blend[substr($0, 1, length($0) - 6)] = 1; next }
              /\.tank\.ron$/ { sheet[substr($0, 1, length($0) - 9)] = 1; next }
              /\.glb$/       { model[substr($0, 1, length($0) - 4)] = 1 }
              END { for (stem in blend) if (stem in sheet && stem in model) print stem }
            ' | LC_ALL=C sort
          )
          if [[ ${#stems[@]} -eq 0 ]]; then
            echo "::error::No asset trio found — the release would ship models nothing verified"
            exit 1
          fi
          printf 'asset: %s\n' "${stems[@]}"
          git lfs install --local
          git lfs pull --include="$(IFS=,; echo "${stems[*]/%/.glb}"),$(IFS=,; echo "${stems[*]/%/.sim.glb}")"
          python3 - "${stems[@]}" <<'PYEOF'
          import hashlib, json, sys
          failed = False
          for stem in sys.argv[1:]:
              cert = json.load(open(stem + ".lod.json"))
              for suffix, key in ((".glb", "view_glb_sha"), (".sim.glb", "sim_glb_sha")):
                  sha = hashlib.sha256(open(stem + suffix, "rb").read()).hexdigest()
                  if sha != cert[key]:
                      print(f"::error::{stem}{suffix} is {sha} but its certificate records {key} {cert[key]}")
                      failed = True
                  else:
                      print(f"identity: {stem}{suffix} == certificate {key}")
          sys.exit(1 if failed else 0)
          PYEOF
          for stem in "${stems[@]}"; do
            python3 scripts/tank/glb_ktx2.py verify "$stem.glb"
          done

      # Releases are cut from `main` only — but from a commit ON main, not from its tip. Requiring
      # the tag to BE the tip loses a race it cannot win: a PR merged while the tag build runs
      # moves the tip, and a tag cut minutes earlier off a perfectly good main is then refused for
      # something that happened after it. Ancestry is the property actually wanted, and it holds
      # forever once true.
      #
      # The checkout above is `fetch-depth: 0` for this step: `merge-base` over a depth-1 history
      # answers about a history it does not have.
      - name: Verify the tag is an ancestor of main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "${tag_sha}" "${main_sha}"; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${tag_sha}, which is not an ancestor of origin/main (${main_sha})"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} (${tag_sha}) is an ancestor of origin/main (${main_sha})"

      # Draft: the Release is invisible (and is not "latest") until `publish-release` un-drafts it.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  # Build and package the Windows + Linux PVP clients without a release-write token; the small
  # upload-client job below publishes the sealed archives. macOS has the equivalent
  # untrusted-build/trusted-sign split further down.
  # Linux runtime floor follows the current ubuntu-latest runner glibc and requires a Vulkan driver.
  # `needs: create-release` + `always()` so it WAITS for the draft Release shell on tags without
  # being gated out by it on a dispatch, where that job is skipped — and then runs on exactly two
  # occasions: a tag whose draft was created, and a dispatch with NO tag input (build-only smoke
  # mode). A dispatch that NAMES a tag is the macOS attach path: it would otherwise build and smoke
  # the dispatched ref, which is a different commit from the tag being attached to, and redden a
  # run whose only job was cutting a .dmg.
  build-client:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      # LFS on R2 via committed `.lfsconfig` (RO). checkout `lfs: true` ignores
      # `.lfsconfig` and still hits GitHub — so pull after checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      # The Linux client links alsa/udev + the windowing (X11/Wayland/xkb) stack — it RENDERS, unlike
      # the headless server, but needs the same compile-time libs. (Windows/MSVC needs none.)
      - name: Install Linux build dependencies
        if: contains(matrix.target, 'linux')
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev

      # The handshake tag digests shipped assets as raw bytes (protocol_id, ADR-0018): a checkout
      # that rewrites line endings ships a client whose connect token the server cannot decrypt.
      # `.gitattributes` pins `* -text`; this trips if that pin is ever lost.
      - name: Shipped assets are byte-identical to the commit (eol guard)
        shell: bash
        run: |
          converted="$(git ls-files --eol -- assets | grep -E 'w/crlf' || true)"
          if [ -n "${converted}" ]; then
            echo "::error::checkout rewrote line endings in assets/ — the map digest diverges from the server's"
            echo "${converted}"
            exit 1
          fi

      # Ship only runtime assets: the game loads .glb meshes, so drop the build-time Blender sources
      # (.blend1 is gitignored, but prune defensively).
      - name: Prune non-runtime assets
        shell: bash
        run: |
          find assets -type f \( -name '*.blend' -o -name '*.blend1' \) -delete

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Build, archive, and checksum without uploading. In dry-run mode the action deliberately
      # withholds github.token from its composite shell, including cargo/build.rs subprocesses.
      # The workflow-level OVERMATCH_DEFAULT_SERVER is baked in via option_env!. Off a non-tag ref
      # (dispatch smoke mode) `$tag` resolves to `dry-run`, so the artifact path below reads the
      # action's `archive` output rather than assuming the tag name.
      - name: Build and package client
        id: package-client
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: overmatch
          target: ${{ matrix.target }}
          locked: true
          # e.g. overmatch-v0.3.0-alpha.1-x86_64-pc-windows-msvc.zip
          archive: $bin-$tag-$target
          # Bundle assets/ next to the binary, under a top-level dir so users extract one
          # self-contained folder.
          include: assets
          leading-dir: true
          tar: unix
          zip: windows
          checksum: sha256
          dry-run: true
          dry-run-intended: true

      - uses: actions/upload-artifact@v4
        with:
          name: overmatch-client-${{ matrix.target }}
          path: ${{ steps.package-client.outputs.archive }}.*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # The Windows smoke lane's server EXECUTABLE — a test fixture, never a shipped artifact: that
      # lane needs a server its runner can exec and the shipped server is a Linux ELF
      # (`smoke-windows` below carries the whole deviation). Its PLACEMENT is load-bearing. This leg
      # has just compiled the same crate from the same commit for the same target and profile, so
      # the target dir is warm and only this second binary is codegen'd. Anywhere downstream it is a
      # cold `lto = "thin"` + `codegen-units = 1` link of the whole crate — MEASURED at 32 min on
      # v0.5.2, and in `smoke-windows` that lands serially on the release critical path.
      - name: Build the Windows server executable (smoke fixture)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --bin overmatch-server

      - uses: actions/upload-artifact@v4
        if: contains(matrix.target, 'windows')
        with:
          name: smoke-fixture-server-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/overmatch-server.exe
          retention-days: 1
          if-no-files-found: error

  # Tag pushes only: attach the archives produced above to the draft Release. This job has
  # release-write permission but performs no checkout, compilation, build script, or proc-macro
  # execution.
  upload-client:
    needs: [create-release, build-client]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: overmatch-client-*
          path: dist
          merge-multiple: true

      - name: Attach clients to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/overmatch-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/overmatch-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.sha256"
            "dist/overmatch-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
            "dist/overmatch-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.sha256"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "::error::Missing required client release asset: ${asset}"
              exit 1
            fi
          done
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # Build and package the Linux dedicated server without a release-write token. Always uploads a
  # plain workflow artifact for scp redeploys (DEPLOY.md). Runs on the same two occasions as
  # `build-client` above, for the same reason and by the same condition: a tag, or a dispatch with
  # no tag input.
  # This one tarball is the ONLY server build in the run: `deploy-server` ships these exact bytes
  # to the droplet and `upload-server` attaches them to the Release.
  build-server:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout stays job-level so the local composite resolves. NO `git lfs pull` here, unlike the
      # client jobs: the server ships a short asset allowlist, and the action hydrates exactly that
      # allowlist — pulling the repo's ~210 MB of LFS objects to pack ~14 MB of them is the cost the
      # scoping removes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false

      # The canonical server build + package recipe (toolchain -> allowlist -> scoped LFS pull ->
      # deps -> cache -> build -> tar). deployed-sha: true bakes a DEPLOYED_SHA marker into the tar,
      # so the tarball on the droplet and the one attached to the Release both name the commit they
      # were built from. Leaves overmatch-server.tar.gz in the workspace root.
      - uses: ./.github/actions/build-server
        with:
          deployed-sha: 'true'

      # Plain artifact: the deploy job's input, and the workflow_dispatch → scp redeploy payload.
      - uses: actions/upload-artifact@v4
        with:
          name: overmatch-server-x86_64-linux
          path: overmatch-server.tar.gz
          retention-days: 14
          if-no-files-found: error

  # THE ARCHIVE SMOKE, Linux lane: the tarballs a user downloads, extracted the way a user extracts
  # them, connected to each other. Nothing here is rebuilt and no path is edited — the shipped
  # server tar boots the shipped server, the shipped client tar runs the shipped client, and the
  # only thing overridden is the server address (`scripts/ci/archive-smoke.sh` documents the whole
  # env contract and the assertions).
  #
  # WHAT IT CATCHES that no earlier gate can: the packaged BYTES. The handshake's `protocol_id`
  # digests shipped assets raw (ADR-0018), so a `level.json` line-ending rewrite, a truncated LFS
  # pointer, or an asset that never made it into the archive all mint a client the server refuses —
  # and every one of those happens downstream of the last thing CI looked at. Three releases
  # shipped exactly that in August 2026.
  #
  # It runs on a tag-less dispatch too (build-only smoke mode), which is what makes a pipeline
  # change testable without cutting a tag. The `if` only restates what the skipped `needs` already
  # decide on the macOS attach path — a job condition is the readable place to say when a lane is
  # meant to run.
  smoke-linux:
    needs: [build-client, build-server]
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only `scripts/ci/archive-smoke.sh` is wanted from the repo — no assets, no LFS. Everything
      # under test arrives as an artifact.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          name: overmatch-server-x86_64-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: overmatch-client-x86_64-unknown-linux-gnu
          path: dist

      # The Linux runtime floor, which a player's machine has and a bare runner image may not:
      # bevy's audio backend links `libasound.so.2` (`DT_NEEDED`, so a missing one is a failure to
      # exec, not a warning). The rendering stack is NOT needed — the simulated client selects the
      # GPU-less root, so wgpu enumerates no adapter and winit is never mounted. The package was
      # renamed in the 64-bit-time_t transition, hence the fallback.
      - name: Install the Linux runtime floor
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libasound2t64 ||
            sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libasound2

      # Exactly what a user does: `tar xzf`, in a directory of their choosing. No `--strip`, no
      # rename, no file touched afterwards.
      - name: Extract both archives
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf dist/overmatch-server.tar.gz -C smoke
          tar -xzf dist/overmatch-*-x86_64-unknown-linux-gnu.tar.gz -C smoke
          find smoke -maxdepth 2 -type f -name 'overmatch*' -print

      - name: The packaged client connects to the packaged server
        run: |
          set -euo pipefail
          client="$(find smoke -maxdepth 2 -type f -name overmatch -perm -u+x | head -1)"
          test -n "${client}"
          bash scripts/ci/archive-smoke.sh smoke/overmatch-server/overmatch-server "${client}"

  # THE ARCHIVE SMOKE, Windows lane — the platform the CRLF defect actually shipped on, and the
  # only client anyone but the author runs.
  #
  # ONE DEVIATION, and it is forced: there is no Windows server artifact and a Windows runner
  # cannot execute the Linux one (GitHub's Windows runners run Windows containers only, so there is
  # no Linux sandbox to borrow either). So the server EXECUTABLE is the `smoke-fixture-server-*`
  # artifact — this same commit, compiled for MSVC on `build-client`'s Windows leg where the target
  # dir is warm — while its ASSETS are the shipped server tarball's, unpacked and handed to it
  # through `BEVY_ASSET_ROOT` exactly as the droplet's unit does. That keeps the whole claim intact:
  # the client under test is the shipped archive, byte for byte, and both halves of the
  # `protocol_id` still have to agree — the compile-time fingerprint (same commit) and the runtime
  # map digest (the shipped map bytes on the server side, the archive's own on the client's).
  #
  # `build-server` stays a `needs` for that ASSET tree: this lane downloads the shipped Linux
  # tarball and runs the fixture against its unpacked assets. Nothing is compiled here.
  smoke-windows:
    needs: [build-client, build-server]
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Only `scripts/ci/archive-smoke.sh` is wanted from the repo — no assets, no LFS. Everything
      # under test arrives as an artifact.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          name: overmatch-server-x86_64-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: overmatch-client-x86_64-pc-windows-msvc
          path: dist
      # Kept out of `dist`: that directory holds the archives a user downloads, and this is a
      # fixture that ships to nobody.
      - uses: actions/download-artifact@v4
        with:
          name: smoke-fixture-server-x86_64-pc-windows-msvc
          path: fixture

      # What a Windows user does with a downloaded zip is Explorer's "Extract All", which is
      # `Expand-Archive` — no `tar`, no path surgery, no post-extraction fixups. The server tarball
      # is unpacked with the `tar` that ships in the Windows image, for its assets only.
      - name: Extract both archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $zip = Get-ChildItem dist -Filter 'overmatch-*-x86_64-pc-windows-msvc.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath smoke -Force
          tar -xzf dist/overmatch-server.tar.gz -C smoke
          Get-ChildItem -Recurse -Depth 1 smoke | Select-Object FullName

      - name: The packaged client connects to the server
        shell: bash
        run: |
          set -euo pipefail
          client="$(find smoke -maxdepth 2 -type f -name 'overmatch.exe' | head -1)"
          test -n "${client}"
          # `BEVY_ASSET_ROOT` is read by a native Windows process, so it must be a Windows path —
          # `pwd -W` is git-bash's translation of its own POSIX view.
          root="$(pwd -W 2>/dev/null || pwd)"
          # The server binary is this run's build; its asset root is the shipped tarball's tree.
          SMOKE_SERVER_ASSET_ROOT="${root}/smoke/overmatch-server" \
            bash scripts/ci/archive-smoke.sh \
              fixture/overmatch-server.exe \
              "${client}"

  # Tag pushes only: put the server artifact built above on the droplet, before any Release becomes
  # visible. No checkout and no compilation — the deployed bytes are the artifact `build-server`
  # produced, never a rebuild here or on the droplet. Auth is the `DROPLET_SSH_KEY` repo secret.
  deploy-server:
    needs: build-server
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize droplet deploys. `cancel-in-progress: false` (queue, don't cancel): a running job
    # may be mid-scp / mid-extract / mid-restart on the droplet, and cancelling there could leave a
    # half-written payload.
    concurrency:
      group: deploy-droplet
      cancel-in-progress: false
    env:
      # The DigitalOcean test droplet. Not a secret — it's public in DEPLOY.md and baked into
      # release clients. Its host key is pinned below; a re-IP updates exactly this one place.
      DROPLET_HOST: 157.245.48.161
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: overmatch-server-x86_64-linux
          path: .

      # Install the deploy key (0600, in RUNNER_TEMP), pin the droplet's host key, ship the payload,
      # extract into a fresh staging dir and swap it into /opt/overmatch-server (a clean install, not
      # a merge over the old tree), restart the unit, and verify (is-active + live SHA).
      - name: Deploy to droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail

          KEY="${RUNNER_TEMP}/deploy_key"
          KNOWN="${RUNNER_TEMP}/known_hosts"

          # Private key from the secret, readable only by us.
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$DROPLET_SSH_KEY" > "$KEY"

          # Pin the droplet's ed25519 host key (from DEPLOY.md) instead of disabling checking. The
          # host is `$DROPLET_HOST` (interpolated); only the key material is a literal.
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHj3I4r44u/XAIAGlqKqGwLPTrXit3dthCHfcBJo390G\n' \
            "${DROPLET_HOST}" > "$KNOWN"

          SSH_OPTS=(-i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN")

          # Ship the payload to /opt, then extract into a FRESH staging dir, swap it into place, and
          # restart + verify on the droplet.
          scp "${SSH_OPTS[@]}" overmatch-server.tar.gz "root@${DROPLET_HOST}:/opt/"
          ssh "${SSH_OPTS[@]}" "root@${DROPLET_HOST}" '
            set -e
            cd /opt
            # Extract into a clean staging dir, NOT over the live tree: a plain `tar xzf` over
            # /opt/overmatch-server leaves files deleted/renamed since the last release lingering on
            # the droplet forever — an invisible skew vs a clean install. The tar unpacks a
            # top-level `overmatch-server/`, so stage it aside first.
            rm -rf overmatch-server.staging
            mkdir overmatch-server.staging
            tar xzf overmatch-server.tar.gz -C overmatch-server.staging
            # Swap the freshly-staged tree into place, THEN restart. The service is still running
            # from the old dir during extract, so we swap before touching the unit: retire the old
            # tree and move the new one in, so the restart below launches the clean install.
            rm -rf overmatch-server.old
            if [ -d overmatch-server ]; then mv overmatch-server overmatch-server.old; fi
            mv overmatch-server.staging/overmatch-server overmatch-server
            rm -rf overmatch-server.staging overmatch-server.old
            systemctl restart overmatch-server
            systemctl is-active overmatch-server
            echo "Deployed SHA on droplet: $(cat /opt/overmatch-server/DEPLOYED_SHA)"
          '
          echo "Deployed ${GITHUB_REF_NAME} (${GITHUB_SHA}) to the droplet."

  # Tag pushes only: attach the sealed server artifact from the read-only build job to the draft
  # Release. This job has release-write permission but performs no checkout or compilation.
  upload-server:
    needs: [create-release, build-server]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: overmatch-server-x86_64-linux
          path: dist

      - name: Attach server to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="overmatch-server-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mv dist/overmatch-server.tar.gz "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$tag" "$asset" "$asset.sha256" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # macOS client, part 1 of 2: the UNTRUSTED build. This job runs the `cargo build` (full dependency
  # graph, arbitrary build.rs / proc-macros) and holds NO Apple signing secrets — no cert import, no
  # notary key. That isolation is the whole point of the split: a compromised transitive crate here
  # cannot reach the Developer ID cert or notary key, because they are never materialized on this
  # runner. It inherits the workflow-level OVERMATCH_DEFAULT_SERVER, baking the droplet address in.
  # If you ever add an Apple secret here, STOP — it belongs in sign-macos below.
  #
  # ON DEMAND ONLY. A tag no longer waits on this job: ~1h20m of arm64 build + notarization for the
  # platform with no playtesters, in front of every release, was the single largest cost in the
  # pipeline and it gated nothing anyone was waiting for. Dispatch with the `tag` input to cut the
  # .dmg for an existing release; dispatch without it to smoke-build the unsigned .app off any ref.
  build-macos:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      # LFS on R2 via `.lfsconfig` — pull after checkout (checkout `lfs: true` hits GitHub).
      # With a `tag` input, THAT tag's tree is what is built and signed — not the dispatched ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          lfs: false
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      # Apple-Silicon-ONLY (2026-07-11, was universal): Intel Macs are <0.5% of Steam and macOS 26
      # is the last Intel macOS; dropping the x86_64 slice + lipo halves this job (~1h25m → one
      # arch). Steamworks depot config: "Apple Silicon Binaries Included" only.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      # With a `tag` input the bundle version is that tag; without one VERSION stays unset and the
      # script falls back to the Cargo.toml version.
      - name: Build the unsigned .app (arm64)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${TAG}" ]]; then
            export VERSION="${TAG#v}"
          fi
          ./scripts/package-macos.sh --build-only

      # actions/upload-artifact zips its input and drops the executable bit + mac metadata, which
      # corrupts a .app bundle. Pack the bundle with `ditto -c -k --keepParent` first — a ditto zip
      # preserves the bundle structure, exec bit, and resource forks — and upload that single file;
      # sign-macos re-extracts it with `ditto -x -k`.
      - name: Pack the .app for transport
        run: ditto -c -k --keepParent dist/Overmatch.app dist/Overmatch-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: overmatch-macos-app
          path: dist/Overmatch-app.zip
          retention-days: 1
          if-no-files-found: error

  # macOS client, part 2 of 2: the TRUSTED sign. This job holds the Apple signing secrets (Developer
  # ID cert + notary key) but runs NO `cargo build` — it only operates on the pre-built .app from
  # build-macos. It produces the signed + notarized arm64 .dmg (the .app inside is also the future
  # Steam macOS depot) and attaches it to the named tag's EXISTING Release — which by then is
  # published, because the tag pipeline never waited for macOS.
  #
  # It runs only for a dispatch that named a `tag`: a smoke dispatch builds the .app and stops, so
  # no Apple secret is ever materialized outside a deliberate release cut.
  sign-macos:
    needs: build-macos
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      # Only the entitlements plist, icon, and the sign script are needed here — no LFS assets (they
      # are already baked into the downloaded .app), so a plain checkout is enough.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: overmatch-macos-app
          path: dist

      # Restore dist/Overmatch.app from the ditto zip with the exec bit + bundle structure intact.
      - name: Unpack the .app
        run: ditto -x -k dist/Overmatch-app.zip dist/

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Write notary API key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"

      - name: Sign, notarize, package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          export VERSION="${TAG#v}"
          ./scripts/package-macos.sh --sign-only

      # `--clobber` so a re-run replaces the .dmg rather than failing on the existing asset.
      - name: Upload .dmg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "${TAG}" \
            dist/overmatch-*-aarch64-apple-darwin.dmg \
            dist/overmatch-*-aarch64-apple-darwin.dmg.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # The invariant's hinge: the draft becomes visible only here, downstream of a live droplet running
  # this run's server artifact, of every client archive being attached, AND of both smoke lanes
  # having connected a freshly extracted client to a server. Any failure upstream leaves the draft
  # unpublished, so the latest visible Release still matches the droplet — and cannot be one whose
  # client never booted.
  #
  # `sign-macos` is deliberately NOT a need: it never runs on a tag, and a skipped need would skip
  # this job with it. Every job named below runs on every tag push, so the plain `if` is enough —
  # no `always()` is needed, and none is wanted (it would publish over a failed deploy).
  publish-release:
    needs: [deploy-server, upload-client, upload-server, smoke-linux, smoke-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
