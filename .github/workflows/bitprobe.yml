# THROWAWAY BRANCH ONLY (hosting/risk-test): GitHub dispatches only workflows whose path exists on
# the default branch and runs the ref's copy of that file, so the risk-test job borrows this path.
# Never merge this file to main.
#
# Dispatch-only throwaway for the Edgegap risk test (.agents/scratch/hosting-2026-10/): builds the
# Linux server with the canonical composite and pushes it as a container image to GHCR. Never runs
# on push.
name: hosting-risk-test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  server-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false

      - uses: ./.github/actions/build-server
        with:
          deployed-sha: 'true'

      # ubuntu:24.04 matches the runner's glibc. libasound2t64 and libudev1 are the DT_NEEDED
      # libraries a Bevy binary links on Linux; the ldd step fails the job on any unresolved one.
      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image
          tar -xzf overmatch-server.tar.gz -C image
          cat > image/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update \
           && apt-get install -y --no-install-recommends libasound2t64 libudev1 ca-certificates \
           && rm -rf /var/lib/apt/lists/*
          COPY overmatch-server /opt/overmatch-server
          WORKDIR /opt/overmatch-server
          ENV BEVY_ASSET_ROOT=/opt/overmatch-server
          EXPOSE 5888/udp
          ENTRYPOINT ["/opt/overmatch-server/overmatch-server"]
          EOF
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/overmatch-server"
          short="${GITHUB_SHA::7}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${image}:${short}" -t "${image}:risk-test" image
          if docker run --rm --entrypoint ldd "${image}:${short}" /opt/overmatch-server/overmatch-server | tee /dev/stderr | grep -q 'not found'; then
            echo "::error::unresolved shared library in the image"
            exit 1
          fi
          docker image ls "${image}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "SHORT=${short}" >> "${GITHUB_ENV}"

      - name: Push image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${SHORT}"
          docker push "${IMAGE}:risk-test"
          echo "pushed ${IMAGE}:${SHORT}"
