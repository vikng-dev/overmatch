name: CI

# The tree's verdict on every push to main and every PR: formatting, the supply chain, lints and
# tests must pass. Keeps the tree fmt-clean and clippy-green so drift can't reaccumulate (the
# release workflow assumes a healthy tree). Two lanes are workflows of their own: the asset door
# (`assets.yml`), which judges a push's range, and the field casts (`field-casts.yml`), a
# measurement rather than a gate.

on:
  push:
    branches: [main]
    # A push whose every changed path matches one of these runs no lane: no test reads them. The
    # source scans keep `.agents/`, `upstream/` and Markdown out of their universe, and the citation
    # scan ignores a citation whose file is gone, so a doc-only push cannot turn a lane red.
    paths-ignore:
      - '.agents/**'
      - '**/*.md'
      - 'upstream/**'
  # Unfiltered: a workflow skipped by a path filter leaves its required checks pending, and a pending
  # required check blocks a pull request's merge.
  pull_request:
  # The asset re-cut before a release is `assets.yml`'s.
  workflow_dispatch:

# A newer run cancels an older one on the same ref: every lane here judges the tree, not a range, so
# the newer verdict covers the older commit. The event is part of the group, so a dispatch never
# cancels a push run, nor a push a dispatch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege: this job only reads the code, so drop the default token down to
# read-only contents (GitHub/OpenSSF hardening guidance).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, dependency-free check: formatting is pure text analysis (no system libs, no
  # compile), so it runs on its own runner in parallel with the slow job and a
  # whitespace slip fails in seconds instead of behind a multi-minute Bevy build.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all --check

  # The supply-chain gate: advisories, licenses, the glam split ban and sources, per `deny.toml`.
  # No compile and no LFS — it reads `Cargo.lock` and the advisory database. `-W unmaintained` is the
  # warn level `deny.toml` cannot express (there `unmaintained` is only a scope).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check -W unmaintained

  # Compile-heavy checks share one matrix but run independently.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, tests]
    name: check (${{ matrix.task }})
    steps:
      # LFS on R2 via committed `.lfsconfig` (RO). checkout `lfs: true` ignores
      # `.lfsconfig` and still hits GitHub — so pull after checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: The vendored crates, from outside the workspace root
        run: bash scripts/ci/vendor-outside-root.sh
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      # Bevy needs these to compile on Linux (alsa/udev + windowing), same as the
      # release build.
      #
      # `update` is non-fatal here and in every other workflow: the runner image
      # ships populated apt indexes, so a mirror that stalls past the 300 s timeout
      # costs nothing. `install` stays strict — an index too stale to resolve these
      # packages fails there, naming the package.
      - name: Install Linux build dependencies
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update || echo "apt-get update timed out or failed; installing from the indexes already on the runner image"
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev jq time

      # One entry per cache family, shared by every job of that family on this OS: `shared-key`
      # replaces the job id rust-cache otherwise puts in the key. clippy is check-only (writes .rmeta,
      # no codegen); a cache it saves leaves every codegen lane recompiling all deps each run, so the
      # check-only lane and the codegen lanes never share a family. The vendored crates are cached
      # with their mtimes pinned (`scripts/ci/vendor-outside-root.sh`), so a change to their content
      # must change the key.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.task == 'clippy' && 'check-only' || 'codegen' }}-${{ hashFiles('vendor/**', '!vendor/**/*.md') }}

      # The default dev profile: opt-3 deps run the lib suite ~6.7× faster than the
      # retired opt-0 `ci` profile paid for once at cache-cold. `--locked` builds
      # against the committed Cargo.lock, so CI is reproducible and fails loudly if
      # the lockfile drifts from Cargo.toml.
      # One feature variant: lightyear compiles unconditionally (the PVP client is the product), and
      # `--all-targets` covers every bin whose required features are on. `dev_tools` is default-on;
      # `dev_ui` (both sandbox bins, bevy_egui) and `bitprobe` are named here because cargo SKIPS a
      # bin whose `required-features` are off — without them those bins were never linted. Additive
      # features only: the lib this lints is the default one plus two optional deps.
      # The retired `--no-default-features` pair proved the sim didn't depend on netcode; that guard
      # now lives in `src/net/tests/net_boundary.rs` (a source scan) + `src/headless_test.rs`
      # (boots the sim with no netcode mounted) — no second full build required.
      - name: Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --locked --all-targets --features dev_ui,bitprobe -- -D warnings

      # The LOD lane's math, before the Cargo lane so a broken ladder fails fast and cheaply. Stdlib
      # + numpy, no Blender and no corpus: every named refusal, every declared gate limit, the
      # branch-and-bound and convex bounds, the bisection's greatest-count contract, the directed
      # search, and the projection the right wall is derived through.
      #
      # WHAT IT NO LONGER DOES is verify a shipped corpus. That corpus was `assets/lod_manifest.json`
      # and it is retired (ADR 0035): the measurements now ship as a per-tank certificate, and the
      # lane that verifies one is the assets workflow's `build.py verify`, which re-cuts the trio from
      # its own source rather than re-reading a document.
      - name: LOD lane math
        if: matrix.task == 'tests'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy
          python3 scripts/lod/test_refusals.py

      - name: Tests
        if: matrix.task == 'tests'
        run: |
          cargo test --locked -- --skip ballistics::field_casts::

  # One context that is green iff EVERY lane a push or a PR runs here is green — `fmt` included,
  # because a summary that omits a lane is a summary that can go green over its failure, whatever
  # branch protection happens to require alongside it today.
  #
  # The asset door is not a lane here: it is `assets.yml`, its own workflow and its own required
  # context (`assets`), because it judges a push's range and must never be cancelled. The field
  # casts (`field-casts.yml`) are a measurement for a design decision, and their red is a finding,
  # not a broken tree.
  check:
    name: check
    needs: [fmt, deny, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all check lanes
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          DENY_RESULT: ${{ needs.deny.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "${FMT_RESULT}" = success
          test "${DENY_RESULT}" = success
          test "${CHECKS_RESULT}" = success
