name: CI

# Fast feedback on every push to main and every PR: formatting, lints, and tests
# must pass. Keeps the tree fmt-clean and clippy-green so drift can't reaccumulate
# (the release workflow assumes a healthy tree).

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the code, so drop the default token down to
# read-only contents (GitHub/OpenSSF hardening guidance).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, dependency-free check: formatting is pure text analysis (no system libs, no
  # compile), so it runs on its own runner in parallel with the slow job and a
  # whitespace slip fails in seconds instead of behind a multi-minute Bevy build.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all --check

  # Compile-heavy checks share one matrix but run independently. In particular, the
  # 30-receiver UDP probe must not contend with another libtest thread.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, tests, shot-stress]
    name: check (${{ matrix.task }})
    steps:
      # LFS on R2 via committed `.lfsconfig` (RO). checkout `lfs: true` ignores
      # `.lfsconfig` and still hits GitHub — so pull after checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Bevy needs these to compile on Linux (alsa/udev + windowing), same as the
      # release build.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev jq time

      - uses: Swatinem/rust-cache@v2

      # `--profile ci` compiles dependencies at opt-level 0 (see Cargo.toml) — far
      # faster to build cold and a smaller cache than the dev profile's opt-level-3
      # deps. `--locked` builds against the committed Cargo.lock, so CI is reproducible
      # and fails loudly if the lockfile drifts from Cargo.toml.
      # One feature variant: lightyear compiles unconditionally (the PVP client is the product), and
      # `--all-targets` covers the client, server, and both sandbox bins. `dev_tools` is default-on.
      # The retired `--no-default-features` pair proved the sim didn't depend on netcode; that guard
      # now lives in `tests/net_boundary.rs` (a source scan) + `src/headless_test.rs` (boots the sim
      # with no netcode mounted) — no second full build required.
      - name: Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --profile ci --locked --all-targets -- -D warnings

      # The LOD chain, before the Cargo lane so a bad corpus fails fast and cheaply. It runs HERE
      # rather than only in `scripts/hooks/pre-push` because a hook is bypassable (`--no-verify`)
      # and, worse, verifies the mutable worktree rather than the commits being pushed — a dirty but
      # self-consistent tree could bless a different committed tree. This runs on the checked-out
      # commit, after `git lfs pull` has hydrated the pointers into real glbs, which is what makes
      # the hash comparison mean anything.
      #
      # Stdlib + numpy, no Blender: verification re-derives every switch distance from the recorded
      # deviations, re-hashes every level, compares the whole gate configuration against the tree,
      # and refuses a manifest that is missing hashes, validity records, gate records or assets.
      - name: LOD chain manifest
        if: matrix.task == 'tests'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy
          python3 scripts/lod/chain.py --verify
          python3 scripts/lod/test_chain.py
          python3 scripts/lod/test_refusals.py

      - name: Tests
        if: matrix.task == 'tests'
        run: |
          cargo test --profile ci --locked -- \
            --skip net::shot_loss::thirty_combatant_volley_reaches_thirty_independent_receivers_under_loss

      - name: Build shot stress test
        if: matrix.task == 'shot-stress'
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/overmatch-test-artifacts.jsonl"
          manifest="$(realpath Cargo.toml)"
          cargo test --profile ci --locked --lib --no-run --message-format=json > "${artifacts}"
          mapfile -t executables < <(
            jq -r --arg manifest "${manifest}" \
              'select(.reason == "compiler-artifact" and .manifest_path == $manifest and .target.kind == ["lib"] and .profile.test and .executable != null) | .executable' \
              "${artifacts}"
          )
          test "${#executables[@]}" -eq 1
          test -x "${executables[0]}"
          printf '%s\n' "${executables[0]}" > "${RUNNER_TEMP}/overmatch-libtest"

      - name: Build shot stress runtime image
        if: matrix.task == 'shot-stress'
        run: |
          docker build --pull \
            --file scripts/ci/shot-stress.Dockerfile \
            --tag overmatch-shot-stress-runtime:ci \
            scripts/ci

      - name: Shot stress test with memory telemetry
        if: matrix.task == 'shot-stress'
        env:
          # DERIVED: four GiB is about ten times the MEASURED prior normal macOS-arm peak while
          # leaving the hosted runner headroom to report a cgroup OOM instead of losing the VM.
          MEMORY_MAX_BYTES: 4294967296
        run: |
          bash scripts/ci/measure-test-memory.sh \
            "$(<"${RUNNER_TEMP}/overmatch-libtest")" \
            net::shot_loss::thirty_combatant_volley_reaches_thirty_independent_receivers_under_loss \
            --exact --test-threads=1 --nocapture

  # THE ASSET DOOR, over every trio the commit holds, with the toolchain the door pins.
  #
  # `scripts/hooks/pre-push` runs the same door — but on the trios a push CHANGED, with this work
  # tree's Rust binary, and behind `OVERMATCH_SKIP=assets`, which is only allowed because of this
  # lane. Here the commit's own rules meet the commit's own bytes: the checkout is the pushed tree,
  # `git lfs pull` hydrates the pointers into real blends and models, and every discovered asset is
  # re-cut from its stored source and compared with the tracked glb byte for byte.
  #
  # DISCOVERY, not a list — the one trio rule, sourced from the file the hook sources
  # (`assets_trios`), so a second vehicle is gated by the rule that found the first and no path is
  # written down here. Zero trios is a failure: a lane that verified nothing would report success.
  #
  # Its own job rather than a lane of the matrix above: it installs a foreign toolchain and pays a
  # Blender launch plus a MEASURED minute of texture encode per asset, and none of that belongs in
  # front of clippy.
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      - uses: dtolnay/rust-toolchain@stable

      # `asset_verify` links the whole crate, so this lane carries the same system libs the Linux
      # client build does — plus the runtime libraries Blender's own binary needs. The runner has no
      # GUI and every launch here is `--background`; these are what the linked binary loads anyway.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 \
            cmake ninja-build

      - uses: Swatinem/rust-cache@v2
        with:
          key: assets

      # The pins are read OUT OF `scripts/toolchain.py`, never restated here: that file is the one
      # declaration, and a version written down in a workflow is a second one that drifts silently.
      # It is RUN rather than quoted into a step, because a step is executable by nothing — no suite
      # can run it, and the one that imported this module from the wrong directory shipped red.
      - name: Resolve the pinned toolchain
        run: |
          set -euo pipefail
          python3 scripts/toolchain.py --pins >> "${GITHUB_ENV}"

      # Blender is a ~300 MB download and the same bytes on every run of a given pin, so it is
      # cached on the pin itself — a moved pin is a different key and a fresh download.
      - name: Cache the pinned Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/overmatch/blender
          key: blender-${{ env.OVERMATCH_BLENDER_VERSION }}-${{ env.OVERMATCH_BLENDER_BUILD }}

      - name: Install the pinned Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          series="${OVERMATCH_BLENDER_VERSION%.*}"
          archive="blender-${OVERMATCH_BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p ~/.cache/overmatch/blender
          curl -fsSL --retry 3 \
            "https://download.blender.org/release/Blender${series}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C ~/.cache/overmatch/blender --strip-components=1

      # basisu ships no Linux binary release, so it is built from the pinned tag. The tag is a pin
      # of its own — upstream's tag scheme does not spell the version — and the assertion step
      # after install proves the built binary prints the pinned version.
      - name: Cache the pinned Basis Universal
        id: basisu-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/overmatch/basisu
          key: basisu-${{ env.OVERMATCH_BASISU_VERSION }}-${{ env.OVERMATCH_BASISU_TAG }}-ubuntu-24.04

      - name: Build the pinned Basis Universal
        if: steps.basisu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${OVERMATCH_BASISU_TAG}" \
            https://github.com/BinomialLLC/basis_universal.git "${RUNNER_TEMP}/basis_universal"
          cmake -S "${RUNNER_TEMP}/basis_universal" -B "${RUNNER_TEMP}/basis_universal/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/basis_universal/build"
          mkdir -p ~/.cache/overmatch/basisu
          cp "${RUNNER_TEMP}/basis_universal/build/basisu" ~/.cache/overmatch/basisu/basisu

      # The same predicate the door's preflight runs, in the same report shape, before anything long
      # starts. An install that produced another build fails here rather than inside the first asset.
      - name: Assert the toolchain
        run: |
          set -euo pipefail
          echo "OVERMATCH_BLENDER=${HOME}/.cache/overmatch/blender/blender" >> "${GITHUB_ENV}"
          echo "OVERMATCH_BASISU=${HOME}/.cache/overmatch/basisu/basisu" >> "${GITHUB_ENV}"
          export OVERMATCH_BLENDER="${HOME}/.cache/overmatch/blender/blender"
          export OVERMATCH_BASISU="${HOME}/.cache/overmatch/basisu/basisu"
          python3 scripts/toolchain.py

      # Every discovered trio, re-cut from its own stored source and compared with the tracked glb.
      # The reports are kept whole: warnings never fail this lane, and the artifact is where they
      # are read.
      - name: Verify every asset through the door
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/asset-reports"
          # Every blend the commit holds is a canonical source, before any of them is verified: a
          # blend of another shape is one discovery would never look at again.
          sh -c '. scripts/hooks/pushed_assets.sh; assets_blend_shape HEAD'
          stems=()
          while IFS= read -r stem; do stems+=("$stem"); done < <(
            sh -c '. scripts/hooks/pushed_assets.sh; assets_trios HEAD'
          )
          if [[ ${#stems[@]} -eq 0 ]]; then
            echo "::error::No asset trio found — this lane would certify nothing and report success"
            exit 1
          fi
          printf 'asset: %s\n' "${stems[@]}"
          for stem in "${stems[@]}"; do
            python3 scripts/tank/asset_door.py verify "${stem}.blend" \
              2>&1 | tee "${RUNNER_TEMP}/asset-reports/$(basename "${stem}").txt"
          done

      - name: The Blender source pass, on its synthetic fixtures
        run: |
          set -euo pipefail
          "${OVERMATCH_BLENDER}" --background --factory-startup \
            --python .agents/blender/test_tank_lint.py
          "${OVERMATCH_BLENDER}" --background --factory-startup \
            --python .agents/blender/test_addon.py

      # The derivation's laws, mutated one at a time on a real exported/baked pair; the door's own
      # chain and its refusals; the finding shape; the coverage table; and the assets lane's own
      # discovery, selection and hydration.
      - name: The derivation and door suites
        run: |
          set -euo pipefail
          python3 scripts/tank/test_report.py
          python3 scripts/tank/test_refusals.py
          python3 scripts/tank/test_glb_ktx2.py
          python3 scripts/tank/test_asset_door.py
          sh scripts/hooks/test_pushed_assets.sh

      - name: The Rust consumer contract
        run: "cargo test --profile ci --locked --lib bake::"

      - name: Asset reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-reports
          path: ${{ runner.temp }}/asset-reports
          # A lane that died before the first asset has no reports and has already said so; a
          # second red step here would only hide which one failed.
          if-no-files-found: warn

  # Preserve the branch-protection context while requiring every matrix lane above.
  check:
    name: check
    needs: [checks, assets]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all check lanes
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          ASSETS_RESULT: ${{ needs.assets.result }}
        run: |
          test "${CHECKS_RESULT}" = success
          test "${ASSETS_RESULT}" = success
