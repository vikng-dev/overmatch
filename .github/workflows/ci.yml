name: CI

# Fast feedback on every push to main and every PR: formatting, lints, and tests
# must pass. Keeps the tree fmt-clean and clippy-green so drift can't reaccumulate
# (the release workflow assumes a healthy tree).

on:
  push:
    branches: [main]
  pull_request:
  # The assets job is path-gated (see below) and therefore skips most pushes. The unconditional
  # re-cut of every trio is a `workflow_dispatch` away — RUN IT BEFORE A RELEASE. The weekly cron
  # that used to run it is retired: at one to two developers and no players, a defect the path gate
  # could not see is bounded by the next release, not by a calendar.
  workflow_dispatch:

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the code, so drop the default token down to
# read-only contents (GitHub/OpenSSF hardening guidance).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, dependency-free check: formatting is pure text analysis (no system libs, no
  # compile), so it runs on its own runner in parallel with the slow job and a
  # whitespace slip fails in seconds instead of behind a multi-minute Bevy build.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all --check

  # Compile-heavy checks share one matrix but run independently.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, tests]
    name: check (${{ matrix.task }})
    steps:
      # LFS on R2 via committed `.lfsconfig` (RO). checkout `lfs: true` ignores
      # `.lfsconfig` and still hits GitHub — so pull after checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Bevy needs these to compile on Linux (alsa/udev + windowing), same as the
      # release build.
      - name: Install Linux build dependencies
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev jq time

      - uses: Swatinem/rust-cache@v2
        with:
          # clippy is check-only (writes .rmeta, no codegen); a cache it saves leaves
          # every codegen lane recompiling all deps each run, so the check-only lane
          # and the codegen lanes never share a key.
          key: ${{ matrix.task == 'clippy' && 'check-only' || 'codegen' }}

      # The default dev profile: opt-3 deps run the lib suite ~6.7× faster than the
      # retired opt-0 `ci` profile paid for once at cache-cold. `--locked` builds
      # against the committed Cargo.lock, so CI is reproducible and fails loudly if
      # the lockfile drifts from Cargo.toml.
      # One feature variant: lightyear compiles unconditionally (the PVP client is the product), and
      # `--all-targets` covers the client, server, and both sandbox bins. `dev_tools` is default-on.
      # The retired `--no-default-features` pair proved the sim didn't depend on netcode; that guard
      # now lives in `tests/net_boundary.rs` (a source scan) + `src/headless_test.rs` (boots the sim
      # with no netcode mounted) — no second full build required.
      - name: Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --locked --all-targets -- -D warnings

      # The LOD lane's math, before the Cargo lane so a broken ladder fails fast and cheaply. Stdlib
      # + numpy, no Blender and no corpus: every named refusal, every declared gate limit, the
      # branch-and-bound and convex bounds, the bisection's greatest-count contract, the directed
      # search, and the projection the right wall is derived through.
      #
      # WHAT IT NO LONGER DOES is verify a shipped corpus. That corpus was `assets/lod_manifest.json`
      # and it is retired (ADR 0035): the measurements now ship as a per-tank certificate, and the
      # lane that verifies one is the assets job's `build.py verify`, which re-cuts the trio from its
      # own source rather than re-reading a document.
      - name: LOD lane math
        if: matrix.task == 'tests'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy
          python3 scripts/lod/test_refusals.py

      - name: Tests
        if: matrix.task == 'tests'
        run: |
          cargo test --locked -- \
            --skip net::shot_loss::thirty_combatant_volley_reaches_thirty_independent_receivers_under_loss

  # The isolated 30-receiver UDP probe with its memory telemetry, ON DEMAND ONLY
  # (`workflow_dispatch`). It is a DIAGNOSTIC, not a gate: it is the lane the ordinary `tests` lane
  # explicitly `--skip`s, it must not contend with another libtest thread, and it pays a docker
  # build on top of a codegen build for a verdict about a probe no push has ever broken. Run it
  # from the Actions tab when the shot-loss path is what changed.
  #
  # It shares the `codegen` rust-cache key with the `tests` lane above on purpose: same profile,
  # same targets, one cache entry — a dispatch off a warm `tests` cache does not recompile the
  # dependency graph, and a check-only (clippy) cache is still never mixed in.
  #
  # NOT a `needs` of the `check` summary below: a job that normally skips can never be a required
  # context.
  shot-stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # LFS on R2 via committed `.lfsconfig` (RO). checkout `lfs: true` ignores
      # `.lfsconfig` and still hits GitHub — so pull after checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Git LFS pull (R2)
        run: |
          git lfs install --local
          git lfs pull

      - uses: dtolnay/rust-toolchain@stable

      # Bevy needs these to compile on Linux (alsa/udev + windowing), same as the
      # release build.
      - name: Install Linux build dependencies
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev jq time

      - uses: Swatinem/rust-cache@v2
        with:
          key: codegen

      - name: Build shot stress test
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/overmatch-test-artifacts.jsonl"
          manifest="$(realpath Cargo.toml)"
          cargo test --locked --lib --no-run --message-format=json > "${artifacts}"
          mapfile -t executables < <(
            jq -r --arg manifest "${manifest}" \
              'select(.reason == "compiler-artifact" and .manifest_path == $manifest and .target.kind == ["lib"] and .profile.test and .executable != null) | .executable' \
              "${artifacts}"
          )
          test "${#executables[@]}" -eq 1
          test -x "${executables[0]}"
          printf '%s\n' "${executables[0]}" > "${RUNNER_TEMP}/overmatch-libtest"

      - name: Build shot stress runtime image
        run: |
          docker build --pull \
            --file scripts/ci/shot-stress.Dockerfile \
            --tag overmatch-shot-stress-runtime:ci \
            scripts/ci

      - name: Shot stress test with memory telemetry
        env:
          # DERIVED: four GiB is about ten times the MEASURED prior normal macOS-arm peak while
          # leaving the hosted runner headroom to report a cgroup OOM instead of losing the VM.
          MEMORY_MAX_BYTES: 4294967296
        run: |
          bash scripts/ci/measure-test-memory.sh \
            "$(<"${RUNNER_TEMP}/overmatch-libtest")" \
            net::shot_loss::thirty_combatant_volley_reaches_thirty_independent_receivers_under_loss \
            --exact --test-threads=1 --nocapture

  # THE ASSET DOOR, over every trio the commit holds, with the toolchain the door pins.
  #
  # THE ONLY PLACE THE DOOR RUNS. The local pre-push hook is the git-lfs upload and nothing else,
  # so this lane is not a backstop for a cheaper local one — it is the verdict. The commit's own
  # rules meet the commit's own bytes: the checkout is the pushed tree, `git lfs pull` hydrates the
  # pointers into real blends and models, and every discovered asset is re-cut from its stored
  # source and compared with the tracked glb byte for byte.
  #
  # DISCOVERY, not a list — the one trio rule, sourced from `scripts/hooks/pushed_assets.sh`
  # (`assets_trios`), so a second vehicle is gated by the rule that found the first and no path is
  # written down here. Zero trios is a failure: a lane that verified nothing would report success.
  #
  # Its own job rather than a lane of the matrix above: it installs a foreign toolchain and pays a
  # Blender launch plus a MEASURED minute of texture encode per asset, and none of that belongs in
  # front of clippy.
  #
  # PATH-GATED, because that cost — MEASURED ~35 min — was being paid by every netcode push for a
  # verdict that could not have moved. The first step asks whether anything in the push's range
  # touches an asset trio or the shared surface (`assets_ci_scope`), and every step below is
  # conditioned on the answer. It fails toward running: an unresolvable range, a missing baseline,
  # a force-push and a manual dispatch all verify everything.
  #
  # The job still RUNS when it skips — it succeeds as a no-op that says why — so the aggregate
  # `check` context below stays green without learning what the assets lane is.
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Full history: the decision below diffs a range, and a depth-1 checkout holds neither the
      # push's baseline nor a pull request's merge base.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 0

      # The decision, and the whole of it, in a sourced shell file — a workflow step that decides
      # anything is a step no suite can run, which is how a broken one ships green.
      # `scripts/hooks/test_pushed_assets.sh` drives this over synthetic ranges.
      - name: Does this range touch an asset verdict
        id: scope
        env:
          ASSETS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ASSETS_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: sh -c '. scripts/hooks/pushed_assets.sh; assets_ci_scope'

      - name: Git LFS pull (R2)
        if: steps.scope.outputs.affected == 'true'
        run: |
          git lfs install --local
          git lfs pull

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.affected == 'true'

      # `asset_verify` links the whole crate, so this lane carries the same system libs the Linux
      # client build does — plus the runtime libraries Blender's own binary needs. The runner has no
      # GUI and every launch here is `--background`; these are what the linked binary loads anyway.
      - name: Install system dependencies
        if: steps.scope.outputs.affected == 'true'
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 \
            cmake ninja-build

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.affected == 'true'
        with:
          key: assets

      # The pins are read OUT OF `scripts/toolchain.py`, never restated here: that file is the one
      # declaration, and a version written down in a workflow is a second one that drifts silently.
      # It is RUN rather than quoted into a step, because a step is executable by nothing — no suite
      # can run it, and the one that imported this module from the wrong directory shipped red.
      - name: Resolve the pinned toolchain
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          python3 scripts/toolchain.py --pins >> "${GITHUB_ENV}"

      # The build decodes glb geometry to census it and to strip the sim artifact, and every stage
      # that measures a surface reads it through numpy.
      - name: Install numpy
        if: steps.scope.outputs.affected == 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check numpy

      # Blender is a ~300 MB download and the same bytes on every run of a given pin, so it is
      # cached on the pin itself — a moved pin is a different key and a fresh download.
      - name: Cache the pinned Blender
        id: blender-cache
        if: steps.scope.outputs.affected == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/overmatch/blender
          key: blender-${{ env.OVERMATCH_BLENDER_VERSION }}-${{ env.OVERMATCH_BLENDER_BUILD }}

      - name: Install the pinned Blender
        if: steps.scope.outputs.affected == 'true' && steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          series="${OVERMATCH_BLENDER_VERSION%.*}"
          archive="blender-${OVERMATCH_BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p ~/.cache/overmatch/blender
          curl -fsSL --retry 3 \
            "https://download.blender.org/release/Blender${series}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C ~/.cache/overmatch/blender --strip-components=1

      # basisu ships no Linux binary release, so it is built from the pinned tag. The tag is a pin
      # of its own — upstream's tag scheme does not spell the version — and the assertion step
      # after install proves the built binary prints the pinned version.
      - name: Cache the pinned Basis Universal
        id: basisu-cache
        if: steps.scope.outputs.affected == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/overmatch/basisu
          key: basisu-${{ env.OVERMATCH_BASISU_VERSION }}-${{ env.OVERMATCH_BASISU_TAG }}-ubuntu-24.04

      - name: Build the pinned Basis Universal
        if: steps.scope.outputs.affected == 'true' && steps.basisu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${OVERMATCH_BASISU_TAG}" \
            https://github.com/BinomialLLC/basis_universal.git "${RUNNER_TEMP}/basis_universal"
          cmake -S "${RUNNER_TEMP}/basis_universal" -B "${RUNNER_TEMP}/basis_universal/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/basis_universal/build"
          # This tag's CMake links executables into the source tree's bin/, not the build tree.
          mkdir -p ~/.cache/overmatch/basisu
          cp "${RUNNER_TEMP}/basis_universal/bin/basisu" ~/.cache/overmatch/basisu/basisu

      # The same predicate the door's preflight runs, in the same report shape, before anything long
      # starts. An install that produced another build fails here rather than inside the first asset.
      - name: Assert the toolchain
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          echo "OVERMATCH_BLENDER=${HOME}/.cache/overmatch/blender/blender" >> "${GITHUB_ENV}"
          echo "OVERMATCH_BASISU=${HOME}/.cache/overmatch/basisu/basisu" >> "${GITHUB_ENV}"
          export OVERMATCH_BLENDER="${HOME}/.cache/overmatch/blender/blender"
          export OVERMATCH_BASISU="${HOME}/.cache/overmatch/basisu/basisu"
          python3 scripts/toolchain.py

      # Every discovered trio, re-cut from its own stored source and compared with the tracked
      # model under its certified rung records (ADR 0035).
      # The reports are kept whole: warnings never fail this lane, and the artifact is where they
      # are read.
      - name: Verify every asset through the build
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/asset-reports"
          # A refused candidate lands in the uploaded reports, because the runner that cut it is
          # gone the moment this job ends.
          export OVERMATCH_DOOR_KEEP="${RUNNER_TEMP}/asset-reports"
          # Every blend the commit holds is a canonical source, before any of them is verified: a
          # blend of another shape is one discovery would never look at again.
          sh -c '. scripts/hooks/pushed_assets.sh; assets_blend_shape HEAD'
          stems=()
          while IFS= read -r stem; do stems+=("$stem"); done < <(
            sh -c '. scripts/hooks/pushed_assets.sh; assets_trios HEAD'
          )
          if [[ ${#stems[@]} -eq 0 ]]; then
            echo "::error::No asset trio found — this lane would certify nothing and report success"
            exit 1
          fi
          printf 'asset: %s\n' "${stems[@]}"
          for stem in "${stems[@]}"; do
            python3 scripts/tank/build.py verify "${stem}.blend" \
              2>&1 | tee "${RUNNER_TEMP}/asset-reports/$(basename "${stem}").txt"
          done

      - name: The Blender source pass, on its synthetic fixtures
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          "${OVERMATCH_BLENDER}" --background --factory-startup \
            --python .agents/blender/test_tank_lint.py
          "${OVERMATCH_BLENDER}" --background --factory-startup \
            --python .agents/blender/test_addon.py

      # The derivation's laws, mutated one at a time on a real exported/baked pair; the door's own
      # chain and its refusals; the trio the build assembles and takes apart; the finding shape; the
      # coverage table; and the assets lane's own discovery, selection and hydration.
      - name: The derivation, door and build suites
        if: steps.scope.outputs.affected == 'true'
        run: |
          set -euo pipefail
          python3 scripts/tank/test_report.py
          python3 scripts/tank/test_refusals.py
          python3 scripts/tank/test_glb_ktx2.py
          python3 scripts/tank/test_build.py
          python3 scripts/tank/test_asset_door.py
          sh scripts/hooks/test_pushed_assets.sh

      - name: The Rust consumer contract
        if: steps.scope.outputs.affected == 'true'
        run: "cargo test --locked --lib bake::"

      - name: Asset reports
        if: ${{ !cancelled() && steps.scope.outputs.affected == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-reports
          path: ${{ runner.temp }}/asset-reports
          # A lane that died before the first asset has no reports and has already said so; a
          # second red step here would only hide which one failed.
          if-no-files-found: warn

  # One context that is green iff EVERY lane a push or a PR runs is green — `fmt` included, because
  # a summary that omits a lane is a summary that can go green over its failure, whatever branch
  # protection happens to require alongside it today.
  #
  # `shot-stress` is deliberately absent, and is the one exception: it is dispatch-only, so needing
  # it would make this context depend on a job that normally skips.
  check:
    name: check
    needs: [fmt, checks, assets]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all check lanes
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          ASSETS_RESULT: ${{ needs.assets.result }}
        run: |
          test "${FMT_RESULT}" = success
          test "${CHECKS_RESULT}" = success
          test "${ASSETS_RESULT}" = success
